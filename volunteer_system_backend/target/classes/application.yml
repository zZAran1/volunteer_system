spring:
  datasource:
    url: jdbc:mysql://localhost:3306/volunteer_system?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: redis # 指定缓存类型为Redis
  data:
    redis:
      host: localhost # Redis服务器地址
      port: 6379      # Redis服务器端口
      database: 0     # 使用的数据库索引
      timeout: 3000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-idle: 1     # 连接池最大空闲连接数
          min-idle: 0     # 连接池最小空闲连接数
          max-wait: 3000
  servlet:
    multipart:
      max-file-size: 5MB        # 限制单个文件大小
      max-request-size: 5MB     # 限制总请求大小
file:
  upload:
    path: D:\Work\upload
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: AUTO
jwt:
  secret: ${JWT_SECRET} # Base64编码
  expiration: 604800000 # 7天